name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # Installs the root workspace plus backend/ and frontend/.
      - run: npm ci
      # Generates frontend/next-env.d.ts and frontend/.next/types before tsc.
      - run: npm run typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
